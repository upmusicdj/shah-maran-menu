<script>
const initialData = {
 brandName:"Shah Maran",brandFa:"کافه شاه ماران",brandType:"CAFÉ",tagline:"Good Food  ·  Great Coffee  ·  Happy Moments",
 categories:[
 {name:"غذا",icon:"🍴",photo:"",items:[["قرمه‌سبزی","580"],["قیمه","580"],["آش رشته","250"]]},
 {name:"صبحانه",icon:"🍳",photo:"",items:[["املت","220"],["سوسیس تخم‌مرغ","280"],["نیمرو","180"],["سوسیس تخم‌مرغ مخصوص","350"]]},
 {name:"بار گرم",icon:"☕",photo:"",items:[["اسپرسو","150"],["آمریکانو","190"],["لاته","280"],["موکا","290"],["هات چاکلت","280"],["چای ماسالا","280"],["هات پسته زعفرانی","320"]]},
 {name:"بار سرد",icon:"❄",photo:"",items:[["آیس آمریکانو","190"],["آیس لاته","280"],["آیس لاته طعم‌دار","320"],["آیس موکا","290"],["آیس کارامل","290"]]},
 {name:"موکتل",icon:"🍸",photo:"",items:[["لیموناد","290"],["موهیتو","290"],["آلورا","290"],["بلو هاوایی","290"],["پشن فروت","290"],["ملورا","320"],["کوکومی","330"],["کوکلا","330"],["بلو اسپرسو","350"],["کوک اسپرسو","230"]]}
 ],logo:"",background:""
};
let data = JSON.parse(localStorage.getItem("shahMaranMenuData") || "null") || structuredClone(initialData);
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function syncBrand(){data.brandName=$("brandName").value;data.brandFa=$("brandFa").value;data.brandType=$("brandType").value;data.tagline=$("tagline").value}
function renderEditors(){
 $("editCategories").innerHTML=data.categories.map((c,ci)=>`<div class="category-tools"><div class="grid"><div class="field"><label>نام دسته‌بندی</label><input value="${esc(c.name)}" oninput="data.categories[${ci}].name=this.value;renderPreview()"></div><div class="field"><label>نماد دسته‌بندی (اختیاری)</label><input value="${esc(c.icon||"")}" oninput="data.categories[${ci}].icon=this.value;renderPreview()"></div></div><div id="items${ci}">${c.items.map((it,ii)=>`<div class="item-editor"><div><label>نام آیتم</label><input value="${esc(it[0])}" oninput="data.categories[${ci}].items[${ii}][0]=this.value;renderPreview()"></div><div><label>قیمت</label><input value="${esc(it[1])}" oninput="data.categories[${ci}].items[${ii}][1]=this.value;renderPreview()"></div><button class="danger" onclick="removeItem(${ci},${ii})">حذف</button></div>`).join("")}</div><div class="actions"><button class="secondary" onclick="addItem(${ci})">+ آیتم</button><button class="danger" onclick="removeCategory(${ci})">حذف دسته‌بندی</button></div></div>`).join("");
 $("photoUploads").innerHTML=data.categories.map((c,i)=>`<div class="field"><label>عکس دسته «${esc(c.name)}»</label><input type="file" accept="image/*" onchange="loadImageFile(event,${i})">${c.photo?`<button class="secondary" onclick="data.categories[${i}].photo='';renderPhotoUploads();renderPreview()">حذف عکس این بخش</button>`:""}</div>`).join("");
}
function addItem(ci){data.categories[ci].items.push(["آیتم جدید","0"]);renderEditors();renderPreview()}
function removeItem(ci,ii){data.categories[ci].items.splice(ii,1);renderEditors();renderPreview()}
function addCategory(){data.categories.push({name:"دسته جدید",icon:"",photo:"",items:[["آیتم جدید","0"]]});renderEditors();renderPreview()}
function removeCategory(ci){if(confirm("این دسته‌بندی و آیتم‌هایش حذف شود؟")){data.categories.splice(ci,1);renderEditors();renderPreview()}}
function renderPhotoUploads(){renderEditors()}
function renderPreview(){
 syncBrand();
 const bg=data.background?`background-image:linear-gradient(#f7f0e3dd,#f7f0e3dd),url('${data.background}');background-size:cover;background-position:center;`:"";
 $("menuPreview").style.cssText=bg;
 const logo=data.logo?`<img src="${data.logo}" alt="لوگو" style="max-width:130px;max-height:90px;object-fit:contain">`:"";
 $("menuPreview").innerHTML=`<div class="brand">${logo}<h1>${esc(data.brandName)}</h1><div class="cafe">${esc(data.brandType)}</div><div class="tag">${esc(data.tagline)}</div></div><div class="menu-sections">${data.categories.map(c=>`<div class="category"><h2>${esc(c.icon||"")} &nbsp; ${esc(c.name)}</h2>${c.photo?`<img class="catphoto" src="${c.photo}" alt="${esc(c.name)}">`:""}${c.items.map(it=>`<div class="item"><span>${esc(it[0])}</span><span class="price">${esc(it[1])}</span></div>`).join("")}</div>`).join("")}</div><div class="footer">${esc(data.brandFa)}<br><small>منوی دیجیتال · Shah Maran</small></div>`;
}
function saveAll(){syncBrand();try{localStorage.setItem("shahMaranMenuData",JSON.stringify(data));alert("تغییرات در همین مرورگر ذخیره شد.")}catch(e){alert("فضای ذخیره مرورگر پر شده است. تصاویر را کوچک‌تر کنید یا نسخه پشتیبان بگیرید.")}}
function loadImageFile(ev,ci){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data.categories[ci].photo=r.result;renderPreview();};r.readAsDataURL(f)}
$("logoUpload").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data.logo=r.result;renderPreview()};r.readAsDataURL(f)});
$("bgUpload").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data.background=r.result;renderPreview()};r.readAsDataURL(f)});
function clearImages(){if(confirm("تمام تصاویر بارگذاری‌شده حذف شوند؟")){data.logo="";data.background="";data.categories.forEach(c=>c.photo="");renderEditors();renderPreview()}}
function exportJSON(){syncBrand();const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});downloadBlob(blob,"shah-maran-menu-backup.json")}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
$("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);$("brandName").value=data.brandName||"";$("brandFa").value=data.brandFa||"";$("brandType").value=data.brandType||"";$("tagline").value=data.tagline||"";renderEditors();renderPreview();saveAll()}catch(err){alert("فایل JSON معتبر نیست.")}};r.readAsText(f)});
function makeQR(){const url=$("publicUrl").value.trim();if(!/^https?:\/\//i.test(url)){alert("ابتدا آدرس کامل منتشرشده را وارد کنید؛ باید با https:// شروع شود.");return}if(!window.QRCode){alert("کتابخانه QR بارگذاری نشد؛ اینترنت را بررسی کنید.");return}$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:url+(url.includes("?")?"&":"?")+"view=1",width:220,height:220,colorDark:"#24190f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}
function downloadQR(){const node=$("qrcode").querySelector("canvas")||$("qrcode").querySelector("img");if(!node){alert("اول QR را بسازید.");return}let url;if(node.tagName==="CANVAS")url=node.toDataURL("image/png");else url=node.src;const a=document.createElement("a");a.href=url;a.download="shah-maran-menu-qr.png";a.click()}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".tab-panel").forEach(p=>p.classList.add("hidden"));$("tab-"+b.dataset.tab).classList.remove("hidden")}));
["brandName","brandFa","brandType","tagline"].forEach(id=>$(id).addEventListener("input",renderPreview));
function init(){ $("brandName").value=data.brandName;$("brandFa").value=data.brandFa;$("brandType").value=data.brandType;$("tagline").value=data.tagline;renderEditors();renderPreview();if(new URLSearchParams(location.search).get("view")==="1"){document.querySelectorAll(".admin-only").forEach(x=>x.classList.add("hidden"));document.body.style.background="#fff";document.querySelector("header").classList.add("hidden");$("previewPanel").style.border="0";$("previewPanel").style.boxShadow="none";$("previewPanel").style.padding="0";$("menuPreview").style.maxWidth="900px";}}
init();
</script>
</body>
</html>
